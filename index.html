<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Honeypot Attacker Heatmap</title>
<link rel="stylesheet" href="lib/leaflet.css"/>
<script src="lib/leaflet.js"></script>
<script src="lib/leaflet-heat.js"></script>
<style>
:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#f85149}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}
#wrap{display:flex;height:100vh}#map{flex:1}
#side{width:340px;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;padding:18px}
h1{font-size:18px;margin:0 0 4px}.sub{color:var(--muted);font-size:12px;margin-bottom:16px}
.stat{display:flex;gap:10px;margin-bottom:16px}
.card{flex:1;background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}
.card .n{font-size:22px;font-weight:700;color:var(--accent)}.card .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--muted);border-bottom:1px solid var(--border);padding:6px 4px;position:sticky;top:0;background:var(--panel)}
td{padding:6px 4px;border-bottom:1px solid #21262d}tr.row{cursor:pointer}tr.row:hover{background:#1f2733}
.hits{color:var(--accent);font-weight:700;text-align:right}.flag{font-size:14px}
.ip{font-family:ui-monospace,monospace;font-size:11px}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--text)}
.leaflet-popup-content b{color:var(--accent)}
.foot{margin-top:16px;color:var(--muted);font-size:11px;line-height:1.5}
</style></head><body>
<div id="wrap"><div id="map"></div><div id="side">
<h1>🍯 Honeypot Attackers</h1><div class="sub">Personal SSH/service honeypot · Wazuh SIEM · updated <span id="ts">…</span></div>
<div class="stat">
<div class="card"><div class="n" id="s-ips">0</div><div class="l">Source IPs</div></div>
<div class="card"><div class="n" id="s-hits">0</div><div class="l">Attacks</div></div>
<div class="card"><div class="n" id="s-cty">0</div><div class="l">Countries</div></div></div>
<table><thead><tr><th></th><th>IP / City</th><th style="text-align:right">Hits</th></tr></thead>
<tbody id="rows"></tbody></table>
<div class="foot">Source IPs collected by a personal honeypot and correlated in Wazuh.
Location = IP datacenter, not operator. Refreshes periodically.</div>
</div></div>
<script>
const flag=cc=>(cc||"").replace(/./g,c=>String.fromCodePoint(127397+c.charCodeAt()));
const map=L.map('map',{worldCopyJump:true}).setView([25,10],2);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
 {attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:19,subdomains:'abcd'}).addTo(map);
const pop=d=>`<b>${d.ip}</b><br>${flag(d.cc)} ${d.city}, ${d.country}<br>${d.isp}<br><b>${d.hits.toLocaleString()}</b> hits`;
async function load(){
  let j; try{ j=await (await fetch('data.json?'+Date.now())).json(); }catch(e){ return; }
  const data=j.attackers||[]; if(!data.length) return;
  const max=Math.max(...data.map(d=>d.hits));
  L.heatLayer(data.map(d=>[d.lat,d.lon,Math.log(d.hits+1)/Math.log(max+1)]),
    {radius:35,blur:25,maxZoom:6,minOpacity:.35,
     gradient:{0.2:'#2b6cff',0.4:'#00d0c0',0.6:'#ffd400',0.8:'#ff7b00',1:'#f85149'}}).addTo(map);
  const mk={};
  data.forEach(d=>{const r=6+14*(Math.log(d.hits+1)/Math.log(max+1));
    mk[d.ip]=L.circleMarker([d.lat,d.lon],{radius:r,color:'#f85149',weight:1,fillColor:'#f85149',fillOpacity:.35})
      .addTo(map).bindPopup(pop(d));});
  document.getElementById('s-ips').textContent=data.length;
  document.getElementById('s-hits').textContent=data.reduce((a,d)=>a+d.hits,0).toLocaleString();
  document.getElementById('s-cty').textContent=new Set(data.map(d=>d.country)).size;
  document.getElementById('ts').textContent=j.updated? new Date(j.updated).toLocaleString():'—';
  const rows=document.getElementById('rows');
  data.forEach(d=>{const tr=document.createElement('tr');tr.className='row';
    tr.innerHTML=`<td class="flag">${flag(d.cc)}</td><td><div class="ip">${d.ip}</div>
      <span style="color:#8b949e">${d.city}, ${d.cc}</span></td><td class="hits">${d.hits.toLocaleString()}</td>`;
    tr.onclick=()=>{map.flyTo([d.lat,d.lon],5);mk[d.ip].openPopup();};rows.appendChild(tr);});
}
load();
</script></body></html>
